spring.application.name=scamshield
server.port=${PORT:8080}

# Postgres + pgvector (see compose.yaml). Local-only demo credentials, overridable by env.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/scamshield}
spring.datasource.username=${DB_USER:scamshield}
spring.datasource.password=${DB_PASSWORD:scamshield}

# Local LLM + embeddings through Ollama (no API key)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${CHAT_MODEL:qwen3.5:4b}
spring.ai.ollama.chat.temperature=0.0
spring.ai.ollama.chat.think=false
spring.ai.ollama.chat.format=json
spring.ai.ollama.embedding.model=${EMBED_MODEL:nomic-embed-text}
spring.ai.ollama.init.pull-model-strategy=when_missing

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

scamshield.llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:45}
scamshield.llm.enabled=${LLM_ENABLED:true}
scamshield.rag.top-k=4
scamshield.advisories-dir=${ADVISORIES_DIR:data/advisories}
scamshield.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:20}

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
